<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1596b3"/>
      <stop offset="1" stop-color="#0a4d63"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#06303d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#shine)"/>
  <!-- outer signal arc doubles as the usage gauge: track, then fill -->
  <path d="M27.75 51.1 A40 40 0 0 1 100.25 51.1" fill="none" stroke="#ffffff" stroke-opacity="0.28"
        stroke-width="8" stroke-linecap="round"/>
  <path d="M27.75 51.1 A40 40 0 0 1 84 33.36" fill="none" stroke="#7ef0c0"
        stroke-width="8" stroke-linecap="round"/>
  <!-- inner signal arcs -->
  <path d="M38.62 56.17 A28 28 0 0 1 89.38 56.17" fill="none" stroke="#ffffff"
        stroke-width="8" stroke-linecap="round"/>
  <path d="M49.5 61.24 A16 16 0 0 1 78.5 61.24" fill="none" stroke="#ffffff"
        stroke-width="8" stroke-linecap="round"/>
  <!-- upload arrow -->
  <path d="M53 100 V74 M44 83 L53 74 L62 83" fill="none" stroke="#ffd166" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- download arrow -->
  <path d="M75 76 V102 M66 93 L75 102 L84 93" fill="none" stroke="#ffffff" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
