<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8cf0"/>
      <stop offset="1" stop-color="#6d3fc4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1b1140" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#shine)"/>
  <!-- gauge track and fill -->
  <path d="M30 86 A38 38 0 1 1 98 86" fill="none" stroke="#ffffff" stroke-opacity="0.22"
        stroke-width="9" stroke-linecap="round"/>
  <path d="M30 86 A38 38 0 0 1 84.5 36.6" fill="none" stroke="#7ef0c0"
        stroke-width="9" stroke-linecap="round"/>
  <!-- download arrow -->
  <path d="M52 44 V74 M42 64 L52 75 L62 64" fill="none" stroke="#ffffff" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- upload arrow -->
  <path d="M76 84 V54 M66 64 L76 53 L86 64" fill="none" stroke="#ffd166" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- baseline bars -->
  <rect x="40" y="94" width="10" height="10" rx="3" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="54" y="90" width="10" height="14" rx="3" fill="#ffffff" fill-opacity="0.75"/>
  <rect x="68" y="86" width="10" height="18" rx="3" fill="#ffffff" fill-opacity="0.9"/>
  <rect x="82" y="92" width="10" height="12" rx="3" fill="#ffffff" fill-opacity="0.6"/>
</svg>
