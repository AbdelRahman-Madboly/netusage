# netusage configuration

[general]
# Interfaces to count. "auto" selects physical NICs only (those with a
# /sys/class/net/<if>/device link), which excludes docker bridges, veth
# pairs, tailscale/VPN tunnels and loopback. Override with a comma list.
interfaces = auto

# Day of month the billing cycle starts.
cycle_day = 25

# Seconds between samples/flushes.
interval = 10

db = /var/lib/netusage/netusage.db

# Per-process accounting backend: auto | ebpf | nethogs | off
backend = auto

# Desktop notification when today's usage crosses these percentages of the
# daily limit. Set daily_limit_gb = 0 to turn notifications off entirely.
daily_limit_gb = 10
notify_at = 80,100,150,200

# Let the Net Usage phone app read this laptop's usage over the home network.
# Read-only, local-network clients only, and only with the token in
# /var/lib/netusage/share.token, which signs each request and is never sent.
# Set share = off to stop it.
share = on
share_port = 8765

# Optional: report extra executable names under one name, `exe = reported name`.
# Useful when a tool runs several helper binaries. Empty by default.
# [aliases]
# my-tool-helper = my-tool
